[package]
name = "sloth"
version = "0.2.0"
edition = "2024"

[dependencies]
ansi-to-tui = "8.0.1"
anyhow = "1.0.102"
clap = { version = "4.5.60", features = ["derive"] }
crossterm = "0.29.0"
dirs = "7.0.0"
gix = "0.80.0"
ignore = "0.4.25"
ratatui = "0.30.0"
rayon = "1.11.0"
self_update = { version = "0.42", features = ["archive-tar", "archive-zip", "compression-flate2"] }
semver = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["full"] }
toml = "1.1.6"
toml_edit = "0.25.15"

[dev-dependencies]
insta = "1.46.3"
